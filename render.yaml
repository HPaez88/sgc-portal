services:
  - type: web
    name: sgc-portal
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgc-portal-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://sgc-portal-933s.onrender.com"
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_ORGANISMO_ID
        value: "1"
      - key: DEFAULT_ORGANISMO_NOMBRE
        value: "OOMAPASC de Cajeme"
      - key: DEFAULT_ORGANISMO_SLUG
        value: "oomapasc"
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true

databases:
  - name: sgc-portal-db
    databaseName: sgc_portal
    user: sgc_portal
